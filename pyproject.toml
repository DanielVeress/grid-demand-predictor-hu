[project]
name = "grid-demand-predictor-hu"
version = "0.1.0"
description = "Forecasting next-day national electricity load for Hungary."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dbt-postgres>=1.10.2",
    "entsoe-py>=0.8.0",
    "numpy>=2.5.0",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
]
